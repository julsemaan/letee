name: Build and publish

on:
  pull_request:
    branches:
      - main
    paths:
      - pyproject.toml
      - letee/__init__.py
    types:
      - closed

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      version: ${{ steps.validate-release.outputs.version }}
    steps:
      - name: Check out merged main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip

      - name: Validate release
        id: validate-release
        env:
          RELEASE_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          python - <<'PY'
          import os
          import re
          import subprocess
          import tomllib
          from pathlib import Path

          project_version = tomllib.loads(
              Path("pyproject.toml").read_text()
          )["project"]["version"]
          package_match = re.fullmatch(
              r'__version__\s*=\s*"([^"]+)"\s*',
              Path("letee/__init__.py").read_text(),
          )
          if package_match is None:
              raise SystemExit("letee/__init__.py does not define __version__")
          package_version = package_match.group(1)

          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", project_version):
              raise SystemExit(
                  f"Version must use MAJOR.MINOR.PATCH format: {project_version!r}"
              )
          if project_version != package_version:
              raise SystemExit(
                  "Version mismatch: "
                  f"pyproject.toml={project_version!r}, "
                  f"letee/__init__.py={package_version!r}"
              )

          expected_branch = f"release/v{project_version}"
          if os.environ["RELEASE_BRANCH"] != expected_branch:
              raise SystemExit(
                  "Release branch mismatch: "
                  f"expected {expected_branch!r}, "
                  f"got {os.environ['RELEASE_BRANCH']!r}"
              )

          tag = f"v{project_version}"
          tag_exists = subprocess.run(
              ["git", "show-ref", "--verify", "--quiet", f"refs/tags/{tag}"],
              check=False,
          ).returncode == 0
          if tag_exists:
              raise SystemExit(f"Tag {tag} already exists")

          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as output:
              output.write(f"version={project_version}\n")
          print(f"Validated release {project_version}")
          PY

      - name: Install quality tools
        run: python -m pip install build coverage ruff twine

      - name: Run quality gate and build distributions
        run: make check

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/letee
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # release/v1

  github-release:
    needs: [build, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/
      - name: Create GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          target_commitish: ${{ github.event.pull_request.merge_commit_sha }}
          generate_release_notes: true
          files: dist/*
