name: Build and publish

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  python-package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
      - name: Verify release tag
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "${GITHUB_REF_NAME}" = "v${version}"
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
      - run: python -m pip install build coverage ruff twine
      - run: make check
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  linux-binary:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build glibc 2.28 binary
        run: |
          docker run --rm -v "$PWD:/io" -w /io quay.io/pypa/manylinux_2_28_x86_64:latest sh -euxc '
            /opt/python/cp311-cp311/bin/python -m pip install pyinstaller
            make PYTHON=/opt/python/cp311-cp311/bin/python binary-check
          '
          mkdir artifact
          cp dist/mtmux LICENSE THIRD_PARTY_NOTICES.md artifact/
          tar -C artifact -czf "mtmux-${GITHUB_REF_NAME}-linux-x86_64.tar.gz" mtmux LICENSE THIRD_PARTY_NOTICES.md
      - name: Smoke test without Python
        run: |
          docker run --rm -v "$PWD/dist/mtmux:/usr/local/bin/mtmux:ro" debian:bookworm-slim sh -euxc '
            ! command -v python3
            apt-get update
            apt-get install -y --no-install-recommends tmux openssh-client
            mtmux --help
            mtmux list
          '
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-binary
          path: mtmux-*.tar.gz
          if-no-files-found: error

  macos-binary:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-13
            arch: x86_64
          - runner: macos-14
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install pyinstaller
      - run: make binary-check
      - run: |
          test "$(uname -m)" = "${{ matrix.arch }}"
          mkdir artifact
          cp dist/mtmux LICENSE THIRD_PARTY_NOTICES.md artifact/
          tar -C artifact -czf "mtmux-${GITHUB_REF_NAME}-macos-${{ matrix.arch }}.tar.gz" mtmux LICENSE THIRD_PARTY_NOTICES.md
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-${{ matrix.arch }}-binary
          path: mtmux-*.tar.gz
          if-no-files-found: error

  publish-pypi:
    needs: python-package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/mtmux
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # release/v1

  github-release:
    needs: [publish-pypi, linux-binary, macos-binary]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release/
          pattern: "*-binary"
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: release/
      - run: cd release && sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          generate_release_notes: true
          files: release/*
