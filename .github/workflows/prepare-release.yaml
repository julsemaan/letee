name: Prepare release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (blank for next patch)"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Bump version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ -z "$INPUT_VERSION" ]]; then
            make bump-version
          else
            VERSION="$INPUT_VERSION"
            export VERSION
            make bump-version VERSION="$VERSION"
          fi

      - name: Read version
        id: version
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Create release branch and commit
        id: release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          branch="release/v$VERSION"
          git switch -c "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml letee/__init__.py
          if git diff --cached --quiet; then
            echo "::error::Requested version $VERSION matches current version; no changes to commit."
            exit 1
          fi
          git commit -m "Release version $VERSION"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Push release branch
        env:
          BRANCH: ${{ steps.release.outputs.branch }}
        run: git push --set-upstream origin "$BRANCH"

      - name: Create release pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.release.outputs.branch }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Release version $VERSION" \
            --body "Merge to publish version $VERSION to PyPI and create its GitHub release."
