# letee managed tmux overlay.
# Sourced by letee on top of your normal tmux configuration.
# Styles, status-right button, and mouse only: no prefix changes.
# Safe to source repeatedly; requires no plugins, fonts, scripts, or network access.
# Options newer than tmux 3.3 are version-gated so older servers source cleanly.

# letee logo palette, matching the sidebar's xterm-256 colors (letee/tui.py PALETTE_256):
#   charcoal #1c1c1c  teal #008787  green #00af87  mint #5fd7af
#   orange #ffaf00  red #d75f5f  muted #808080  border #444444  text #d0d0d0
set -g status-style "bg=#1c1c1c,fg=#d0d0d0"
set -g window-status-style "fg=#808080,bg=#1c1c1c"
set -g window-status-current-style "fg=#5fd7af,bg=#303030,bold"
set -g window-status-activity-style "fg=#ffaf00,bg=#1c1c1c"
set -g window-status-bell-style "fg=#d75f5f,bg=#1c1c1c,bold"
set -g mode-style "fg=#1c1c1c,bg=#5fd7af"

# Pane borders.
set -g pane-border-style "fg=#444444"
set -g pane-active-border-style "fg=#5fd7af"

# Messages and popups.
set -g message-style "fg=#d0d0d0,bg=#303030"
set -g message-command-style "fg=#5fd7af,bg=#303030"
set -g popup-style "fg=default,bg=default"
set -g popup-border-style "fg=#008787"
set -g popup-border-lines rounded

# Copy mode search and the clock / pane-number overlays.
set -g copy-mode-match-style "fg=#d0d0d0,bg=#005f5f"
set -g copy-mode-current-match-style "fg=#1c1c1c,bg=#ffaf00"
set -g clock-mode-colour "#5fd7af"
set -g display-panes-colour "#008787"
set -g display-panes-active-colour "#5fd7af"

# Input and clipboard behavior.
set -g mouse on
set -s set-clipboard on
set -g allow-passthrough on

# Bell monitoring: audible bells, no visual bell.
set -g monitor-bell on
set -g bell-action any
set -g visual-bell off

%if "#{>=:#{version},3.4}"
# Menus gained styles in tmux 3.4.
set -g menu-style "fg=default,bg=default"
set -g menu-selected-style "fg=#1c1c1c,bg=#5fd7af"
set -g menu-border-style "fg=#008787"
set -g menu-border-lines rounded

# Add a clickable new-window button before the right-side status content.
# The label is ASCII so it renders on hosts without a UTF-8 locale. The length
# increase (11) is the label's width: " + window " plus the separating space.
# Track the last length set by letee so reinstalling the button cannot add it twice.
if-shell -F '#{!=:#{status-right-length},#{@letee_status_right_length}}' {
    set -gF status-right-length '#{?#{==:#{status-right-length},0},0,#{e|+:#{status-right-length},11}}'
    set -gF @letee_status_right_length '#{status-right-length}'
}
# Check status-right so stale markers cannot suppress or duplicate the button.
if-shell -F '#{!=:#{m:*#\[*range=user\|letee-new]*,#{status-right}},1}' {
    set -gF status-right '#[fg=#1c1c1c,bg=#5fd7af,bold,range=user|letee-new] + window #[default,range=right] #{status-right}'
}
bind -n MouseDown1Status if-shell -F '#{==:#{mouse_status_range},letee-new}' { new-window -c "#{pane_current_path}" } { select-window -t = }
%endif
