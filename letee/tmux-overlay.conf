# letee managed tmux overlay.
# Sourced by letee on top of your normal tmux configuration.
# Styles, status-right button, and mouse only: no prefix changes.
# Safe to source repeatedly; requires no plugins, fonts, scripts, or network access.
# The ＋ add window button needs tmux 3.4+; older tmux skips it and applies the rest.

# Catppuccin Mocha colors for existing status elements.
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g window-status-style "fg=#a6adc8,bg=#1e1e2e"
set -g window-status-current-style "fg=#f5c2e7,bg=#313244"
set -g window-status-activity-style "fg=#f9e2af,bg=#1e1e2e"
set -g window-status-bell-style "fg=#f38ba8,bg=#1e1e2e,bold"
set -g mode-style "fg=#1e1e2e,bg=#f5c2e7"

# Pane borders.
set -g pane-border-style "fg=#585b70"
set -g pane-active-border-style "fg=#f5c2e7"

# Messages, popups, and menus.
set -g message-style "fg=#cdd6f4,bg=#313244"
set -g message-command-style "fg=#cdd6f4,bg=#313244"
set -g popup-style "bg=#313244,fg=#cdd6f4"
set -g popup-border-style "fg=#585b70"
set -g menu-style "fg=#cdd6f4,bg=#313244"
set -g menu-selected-style "fg=#f5c2e7,bg=#45475a"

# Input and clipboard behavior.
set -g mouse on
set -s set-clipboard on
set -g allow-passthrough on

# Bell monitoring: audible bells, no visual bell.
set -g monitor-bell on
set -g bell-action any
set -g visual-bell off

# Add a clickable button before the right-side status content (tmux 3.4+).
# Check status-right so stale markers cannot suppress or duplicate the button.
%if "#{>=:#{version},3.4}"
if-shell -F '#{!:#{m:*letee-new*,#{status-right}}}' {
    set -gF status-right '#[fg=#1e1e2e,bg=#a6e3a1,bold,range=user|letee-new] ＋ add #[range=right default] #{status-right}'
}
bind -n MouseDown1Status if-shell -F '#{==:#{mouse_status_range},letee-new}' 'new-window -c "#{pane_current_path}"' 'select-window -t ='
%endif
